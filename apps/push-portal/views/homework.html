<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HW Notifier · Homework</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      var mode = localStorage.getItem('theme-mode');
      if (!mode || mode === 'system') mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      var color = localStorage.getItem('theme-color') || 'indigo';
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.setAttribute('data-color', color);
    })();
  </script>
  <style>
    /* ══ Design Tokens ══ */
    :root {
      --bg: #101019; --bg-sidebar: #16162a; --bg-card: #1a1a30;
      --bg-input: #141425; --bg-hover: #1e1e38; --bg-table-header: #1e1e35;
      --ink: #e2e2ef; --ink-secondary: #9d9db5; --muted: #6e6e8a;
      --border: #2a2a45; --border-light: #232340;
      --success: #22c55e; --success-soft: rgba(34,197,94,0.12);
      --danger: #ef4444; --danger-soft: rgba(239,68,68,0.12);
      --warning: #eab308;
      --radius: 8px; --radius-sm: 6px;
      --sidebar-w: 220px; --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
      --primary: #6366f1; --primary-hover: #818cf8;
      --primary-soft: rgba(99,102,241,0.12); --primary-glow: rgba(99,102,241,0.25);
      --accent: var(--primary); --accent-hover: var(--primary-hover);
      --accent-soft: var(--primary-soft); --accent-glow: var(--primary-glow);
    }
    [data-theme="light"] {
      --bg: #f8fafc; --bg-sidebar: #ffffff; --bg-card: #ffffff;
      --bg-input: #f1f5f9; --bg-hover: #f1f5f9; --bg-table-header: #f8fafc;
      --ink: #0f172a; --ink-secondary: #475569; --muted: #64748b;
      --border: #e2e8f0; --border-light: #f1f5f9;
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
    }
    [data-color="blue"]    { --primary:#3b82f6; --primary-hover:#60a5fa; --primary-soft:rgba(59,130,246,.12); --primary-glow:rgba(59,130,246,.25); }
    [data-color="emerald"] { --primary:#10b981; --primary-hover:#34d399; --primary-soft:rgba(16,185,129,.12); --primary-glow:rgba(16,185,129,.25); }
    [data-color="rose"]    { --primary:#f43f5e; --primary-hover:#fb7185; --primary-soft:rgba(244,63,94,.12);  --primary-glow:rgba(244,63,94,.25); }
    [data-color="violet"]  { --primary:#8b5cf6; --primary-hover:#a78bfa; --primary-soft:rgba(139,92,246,.12); --primary-glow:rgba(139,92,246,.25); }
    [data-color="amber"]   { --primary:#f59e0b; --primary-hover:#fbbf24; --primary-soft:rgba(245,158,11,.12); --primary-glow:rgba(245,158,11,.25); }

    @font-face {
      font-family: 'LINE Seed Sans TH';
      src: url('https://cdn.jsdelivr.net/gh/cpxdevth/LineSeedFont@main/Fonts/LINESeedSansTH_W_Bd.woff2') format('woff2');
      font-weight: 700; font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed Sans TH';
      src: url('https://cdn.jsdelivr.net/gh/cpxdevth/LineSeedFont@main/Fonts/LINESeedSansTH_W_Rg.woff2') format('woff2');
      font-weight: 400; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
    }
    h1,h2,h3,.card-title,.sidebar-name,.sidebar-logo {
      font-family: 'LINE Seed Sans TH', 'Sarabun', sans-serif;
    }
    a { color: inherit; text-decoration: none; }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; overflow-y: auto;
    }
    .sidebar-brand {
      padding: 20px 18px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo {
      width: 28px; height: 28px; background: var(--accent);
      border-radius: var(--radius-sm); display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 0.8rem;
      color: white; flex-shrink: 0;
    }
    .sidebar-name { font-weight: 700; font-size: 0.9rem; letter-spacing: -0.01em; }
    .sidebar-nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .sidebar-link {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: var(--radius-sm); font-size: 0.855rem; color: var(--ink-secondary);
      transition: background 0.12s, color 0.12s; cursor: pointer; border: none;
      background: transparent; width: 100%; text-align: left; font-family: inherit;
    }
    .sidebar-link:hover { background: var(--bg-hover); color: var(--ink); }
    .sidebar-link.is-active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
    .sidebar-icon { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
    .sidebar-link.is-active .sidebar-icon { opacity: 1; }
    .sidebar-footer {
      padding: 14px 18px; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .mobile-nav {
      display: none; background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
      padding: 10px 16px; gap: 4px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10;
    }
    .mobile-nav a {
      padding: 7px 14px; border-radius: var(--radius-sm); font-size: 0.82rem;
      color: var(--ink-secondary); transition: background 0.12s, color 0.12s; cursor: pointer;
    }
    .mobile-nav a:hover { background: var(--bg-hover); color: var(--ink); }
    .mobile-nav a.is-active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }

    .main {
      margin-left: var(--sidebar-w); flex: 1; padding: 40px; max-width: 900px;
      animation: pageEnter 0.25s cubic-bezier(0,0,0.2,1) forwards;
    }
    @keyframes pageEnter {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 1.8rem; margin-bottom: 4px; }
    .page-header p { color: var(--muted); font-size: 0.875rem; }

    /* Cards */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; min-width: 0;
      transition: border-color 0.2s ease; margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.88rem; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border-bottom: 1px solid var(--border-light); padding-bottom: 12px;
    }
    
    .hw-list { display: flex; flex-direction: column; gap: 12px; }
    .hw-item {
      background: var(--bg-input); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .hw-title { font-size: 1rem; font-weight: 600; color: var(--ink); }
    .hw-subject { font-size: 0.85rem; color: var(--primary); font-weight: 500; }
    .hw-detail { font-size: 0.85rem; color: var(--ink-secondary); line-height: 1.5; white-space: pre-wrap; }
    .hw-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--border-light);
      font-size: 0.8rem; color: var(--muted);
    }
    .hw-due { color: var(--warning); font-weight: 500; }

    button, .btn {
      background: var(--primary); color: #fff; border: 1px solid transparent;
      padding: 9px 18px; border-radius: var(--radius); font-family: inherit;
      font-weight: 600; font-size: 0.88rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease;
      text-decoration: none;
    }
    button:hover,.btn:hover { background: var(--primary-hover); }
    button:active,.btn:active { transform: scale(0.97); }
    .btn-submit { background: var(--success); }
    .btn-submit:hover { background: #16a34a; }
    
    .empty-state { text-align:center; padding:32px 16px; color:var(--muted); font-size:.83rem; line-height:1.6; }

    @media (max-width:860px) {
      .sidebar { display:none; }
      .layout { flex-direction:column; }
      .mobile-nav { display:flex !important; }
      .main { margin-left:0; padding:20px 20px 40px; max-width:100%; }
    }
    @media (max-width:540px) {
      .main { padding:16px 14px 36px; }
      .page-header h1 { font-size:1.3rem; }
      .hw-meta { flex-direction: column; align-items: flex-start; gap: 10px; }
      .hw-meta .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">HW</div>
      <span class="sidebar-name">HW Notifier</span>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link is-active" href="/homework">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="6" x2="12" y2="14"/><line x1="8" y1="10" x2="16" y2="10"/></svg>
        Homework
      </a>
      <a class="sidebar-link" href="/">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Push Notify
      </a>
    </nav>
    <div class="sidebar-footer">
      <span>Push Portal · 8082</span>
    </div>
  </aside>

  <!-- Mobile nav -->
  <div class="mobile-nav">
    <a class="is-active" href="/homework">Homework</a>
    <a href="/">Push Notify</a>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <h1>Homework</h1>
      <p>รายการการบ้านและงานที่ได้รับมอบหมายของทีมที่คุณเลือก</p>
    </div>

    <div id="contentArea">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>
</div>

<script>
// Format date helper
function fmtTime(iso) {
  if (!iso) return "ไม่มีกำหนด";
  try { return new Date(iso).toLocaleString("th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Bangkok"}); }
  catch { return iso; }
}

function escapeHtml(unsafe) {
  return (unsafe||"").toString()
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function loadData() {
  const area = document.getElementById("contentArea");
  const selectedTeamIds = JSON.parse(localStorage.getItem("push_teamIds") || "[]");
  
  if (selectedTeamIds.length === 0) {
    area.innerHTML = `
      <div class="card">
        <div class="empty-state">
          คุณยังไม่ได้เลือกทีม/ห้องเรียน<br>
          <a href="/" style="color:var(--primary);text-decoration:underline;margin-top:12px;display:inline-block;">ไปหน้า Push Notify เพื่อเลือกทีม</a>
        </div>
      </div>`;
    return;
  }

  try {
    const teamsRes = await fetch("/api/teams-with-students");
    const teamsData = await teamsRes.json();
    const allTeams = teamsData.teams || [];
    
    let html = "";
    
    for (const teamId of selectedTeamIds) {
      const teamInfo = allTeams.find(t => t.id === teamId);
      if (!teamInfo) continue;
      
      html += `<div class="card"><div class="card-title">${escapeHtml(teamInfo.name)}</div>`;
      
      const hwRes = await fetch(`/api/homework?teamId=${teamId}`);
      const hwData = await hwRes.json();
      const homeworkList = hwData.homework || [];
      
      if (homeworkList.length === 0) {
        html += `<div class="empty-state" style="padding:16px;">ยังไม่มีการบ้าน</div></div>`;
        continue;
      }
      
      html += `<div class="hw-list">`;
      homeworkList.forEach(hw => {
        let submitBtn = "";
        
        // Build Submit URL
        if (teamInfo.googleFormUrl && teamInfo.googleFormEntryId) {
          const baseUrl = teamInfo.googleFormUrl;
          const entryId = teamInfo.googleFormEntryId;
          const title = encodeURIComponent(hw.title || "");
          const subject = encodeURIComponent(hw.subject || "");
          const separator = baseUrl.includes('?') ? '&' : '?';
          
          let submitUrl = `${baseUrl}${separator}usp=pp_url&${entryId}=${title}`;
          if (teamInfo.googleFormSubjectEntryId && subject) {
            submitUrl += `&${teamInfo.googleFormSubjectEntryId}=${subject}`;
          }
          
          submitBtn = `<a href="${submitUrl}" target="_blank" class="btn btn-submit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> ส่งงานที่นี่</a>`;
        }
        
        html += `
          <div class="hw-item">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div class="hw-subject">${escapeHtml(hw.subject)}</div>
                <div class="hw-title">${escapeHtml(hw.title)}</div>
              </div>
            </div>
            ${hw.detail ? `<div class="hw-detail">${escapeHtml(hw.detail)}</div>` : ''}
            <div class="hw-meta">
              <div>กำหนดส่ง: <span class="hw-due">${fmtTime(hw.due)}</span></div>
              ${submitBtn}
            </div>
          </div>
        `;
      });
      html += `</div></div>`; // hw-list and card
    }
    
    if (!html) {
      area.innerHTML = `<div class="empty-state">ไม่พบข้อมูลการบ้านสำหรับทีมที่คุณเลือก</div>`;
    } else {
      area.innerHTML = html;
    }
    
  } catch (err) {
    area.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
  }
}

loadData();
</script>
</body>
</html>
